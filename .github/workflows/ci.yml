name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run the live `eval` job on demand

jobs:
  # Keyless gate — runs on every push/PR. tsc + all self-checks (skills, transcriber,
  # server-utils, eval graders). No API key, no network, ~seconds.
  check:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ci-placeholder # ponytail: agents/orchestrator self-checks build models but never call them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  # Live model eval — costs Vertex AI quota, so it's manual only (workflow_dispatch).
  # Auth is Vertex AI ADC, the same as the app: there are no API keys anywhere in this
  # repo. Set two repo secrets first — GCP_SA_KEY (a service account JSON with the
  # Vertex AI User role) and GCP_PROJECT_ID. Grades against evals/baseline.json and
  # fails if a metric regresses (once a baseline is committed).
  eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: global
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: npm run dev &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "server never came up (bad ADC credentials or missing Vertex AI quota?)" && exit 1
      - run: npm run eval
